<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Update APK Link</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .admin-card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #db0011; /* Matching primary color from site */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        .btn-submit:hover {
            background-color: #b5000e;
        }
        .btn-submit:active {
            transform: scale(0.98);
        }
        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }
        .success { 
            display: block !important;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error { 
            display: block !important;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2><i class="fa-brands fa-envira" style="color: #FFA000;"></i> App Link Admin</h2>
        <form id="adminForm">
            <div class="form-group">
                <label for="apkUrl">Current APK Link (Firebase)</label>
                <input type="text" id="apkUrl" name="apk_url" placeholder="Loading from Firebase..." required>
            </div>
            <button type="submit" class="btn-submit">
                <i class="fa-solid fa-cloud-arrow-up"></i> Update Download Link
            </button>
        </form>
        <div id="message"></div>
    </div>

    <!-- Firebase App (the core Firebase SDK) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD82sEEWImPd5r4GzLiR0zTyuHqjOlrNm0",
            authDomain: "links-26dd8.firebaseapp.com",
            projectId: "links-26dd8",
            storageBucket: "links-26dd8.firebasestorage.app",
            messagingSenderId: "145330747748",
            appId: "1:145330747748:web:7a9ff449961f8d367aa271",
            measurementId: "G-XCCLWG39YG",
            databaseURL: "https://links-26dd8-default-rtdb.firebaseio.com"
        };
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        
        const db = firebase.database();
        const linkRef = db.ref('CANARA');

        // Fetch current link
        linkRef.on('value', (snapshot) => {
            const val = snapshot.val();
            if(val) {
                document.getElementById('apkUrl').value = val;
            } else {
                document.getElementById('apkUrl').placeholder = "Enter download URL...";
            }
        }, (error) => {
            console.error("Firebase read failed: " + error.code);
            const msgDiv = document.getElementById('message');
            msgDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Database read failed: Check Firebase Database Rules (Set read/write to true).';
            msgDiv.className = 'error';
        });

        // Handle form submission
        document.getElementById('adminForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newUrl = document.getElementById('apkUrl').value;
            const msgDiv = document.getElementById('message');
            const submitBtn = this.querySelector('.btn-submit');
            
            // UI feedback
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating...';
            submitBtn.disabled = true;

            linkRef.set(newUrl)
            .then(() => {
                msgDiv.innerHTML = '<i class="fa-solid fa-check-circle"></i> Link updated successfully on Firebase!';
                msgDiv.className = 'success';
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
                
                // Hide success message after 3 seconds
                setTimeout(() => {
                    msgDiv.style.display = 'none';
                    msgDiv.className = '';
                }, 3000);
            })
            .catch((error) => {
                msgDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Failed to update: ' + error.message;
                msgDiv.className = 'error';
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
                console.error(error);
            });
        });
    </script>
</body>
</html>
